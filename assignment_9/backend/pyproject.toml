[project]
name = "ai-decision-flow"
version = "0.1.0"
description = "Visual AI Decision Flow with React Flow + Inngest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "inngest>=0.4.0",
    "litellm>=1.40.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
