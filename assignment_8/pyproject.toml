[project]
name = "pdf-report-generator"
version = "0.1.0"
description = "FlyRank Internship Week 7 Assignment A8 / BE-08 - PDF report generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.5.0",
    "playwright>=1.42.0",
    "weasyprint>=61.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
